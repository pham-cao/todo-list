<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Việc cần làm</title>
  <link rel="stylesheet" href="../../../../design-system.css">
  <style>
    /* Prototype only: the note strip and labelled variants are not part of the product. */
    .proto { max-width: var(--sheet-max); margin: 0 auto var(--space-3); padding: 0 var(--space-2); font-size: var(--fs-tiny); color: var(--text-muted); text-align: center; line-height: 1.5; }
    .proto a { font-weight: var(--fw-semibold); }
    .proto-variant { max-width: var(--sheet-max); margin: var(--space-10) auto 0; }
    .proto-variant > h2 { font-size: var(--fs-tiny); font-weight: var(--fw-semibold); color: var(--text-muted); margin: 0 0 var(--space-3); text-align: center; }
    .proto-variant .sheet { min-height: 0; }
  </style>
</head>
<body>
  <div class="desk">
  <p class="proto" lang="en">Prototype: <strong>Future day, empty</strong>. The next arrow opens the picker sample instead of 12/11. <a href="../index.html">All screens</a></p>
  <main class="sheet">
    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-header__title">Việc cần làm</h1>
      </div>
      <nav class="app-header__nav day-nav">
        <div class="day-nav__step">
          <a class="icon-btn day-nav__turn" href="tomorrow.html" aria-label="Xem ngày trước"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
          <a class="icon-btn day-nav__turn" href="picker-open.html" aria-label="Xem ngày sau"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></a>
        </div>
        <span class="date-stamp" data-tip="Chọn ngày"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14h2M14 14h2M8 17h2"/></svg><input type="date" aria-label="Chọn ngày" value="2026-11-11" min="2000-01-01" max="2099-12-31"></span>
        <a class="today-tab" href="today.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Về hôm nay</a>
      </nav>
      <p class="app-header__date washi" aria-live="polite">Thứ Tư, 11/11/2026</p>

    </header>
    <div class="sheet__body">
      <form class="add-form" action="../../../daily-task-log/ux/screens/today--add-error.html">
        <label class="visually-hidden" for="new-task">Bạn cần làm gì ngày này?</label>
        <span class="add-form__pen" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"/></svg></span>
        <div class="add-form__line">
          <input class="add-form__input" id="new-task" name="text" type="text" placeholder="Bạn cần làm gì ngày này?" autocomplete="off">
          <button class="btn btn--primary" type="submit">Thêm</button>
        </div>
      </form>
      <div class="empty">
        <svg class="empty__art" viewBox="0 0 132 132" aria-hidden="true">
          <path class="doodle doodle--pen" d="M58 30c-4-6 4-9 0-16M70 30c-4-6 4-9 0-16M82 30c-4-6 4-9 0-16"/>
          <path class="doodle" d="M48 40h46l-3 6H51z"/><path class="doodle" d="M52 46l2 22h34l2-22"/>
          <path class="doodle" d="M64 40v-4c0-2 2-3 3.5-3h7c1.5 0 3.5 1 3.5 3v4"/><path class="doodle" d="M40 70h62"/>
          <path class="doodle" d="M50 74c0 22 6 34 21 34s21-12 21-34z"/><path class="doodle" d="M92 80c9 0 11 12 1 14"/>
          <path class="doodle" d="M58 92c4 3 22 3 26 0" stroke-dasharray="2 4"/><path class="doodle" d="M71 68v3M71 75v2"/>
          <path class="doodle" d="M28 118c22-3 58-3 82 0"/>
        </svg>
        <p class="empty__text">Ngày này chưa có việc nào. Hãy thêm việc để chuẩn bị nhé!</p>
      </div>
    </div>
  </main>

  </div>
</body>
</html>
