<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <link rel="icon" href="data:,">
  <title>Việc cần làm hôm nay</title>
  <link rel="stylesheet" href="docs/project/design-system.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="desk">
  <main class="sheet" aria-labelledby="page-title">
    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-header__title" id="page-title">Việc cần làm hôm nay</h1>
        <div class="app-header__nav"><!-- Reserved for day-navigation (page turning). Empty in this feature. --></div>
      </div>
      <p class="app-header__date washi" id="date-line"></p>
      <div class="app-header__mark progress" id="progress" aria-hidden="true" hidden><svg viewBox="0 0 36 36"><circle class="progress__track" cx="18" cy="18" r="15"/><circle class="progress__ink" cx="18" cy="18" r="15" pathLength="100"/></svg><span class="progress__stamp" aria-hidden="true"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="58 3 30 2 70"/><circle cx="30" cy="30" r="21.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M30 13.5l4.6 10 10.9 1.1-8.2 7.3 2.4 10.7L30 37.1l-9.7 5.5 2.4-10.7-8.2-7.3 10.9-1.1z" fill="currentColor"/></svg></span></div>
      <p class="app-header__summary" id="summary" role="status" hidden>Đã hoàn thành <strong id="summary-count"></strong> việc</p>
      <div class="alert alert--warning" id="storage-slip" role="alert" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><p>Không thể lưu dữ liệu trên trình duyệt này. Công việc có thể bị mất khi bạn tải lại trang.</p></div>
    </header>
    <div class="sheet__body">
      <form class="add-form" id="add-form" novalidate>
        <label class="visually-hidden" for="new-task">Bạn cần làm gì hôm nay?</label>
        <span class="add-form__pen" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"/></svg></span>
        <div class="add-form__line">
          <input class="add-form__input" id="new-task" name="text" type="text" placeholder="Bạn cần làm gì hôm nay?" autocomplete="off">
          <button class="btn btn--primary" type="submit">Thêm</button>
        </div>
        <p class="field-error" id="new-task-error" role="alert" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="field-error__text"></span></p>
      </form>
      <div class="empty" id="empty" hidden>
        <svg class="empty__art" viewBox="0 0 132 132" aria-hidden="true">
          <path class="doodle doodle--pen" d="M58 30c-4-6 4-9 0-16M70 30c-4-6 4-9 0-16M82 30c-4-6 4-9 0-16"/>
          <path class="doodle" d="M48 40h46l-3 6H51z"/>
          <path class="doodle" d="M52 46l2 22h34l2-22"/>
          <path class="doodle" d="M64 40v-4c0-2 2-3 3.5-3h7c1.5 0 3.5 1 3.5 3v4"/>
          <path class="doodle" d="M40 70h62"/>
          <path class="doodle" d="M50 74c0 22 6 34 21 34s21-12 21-34z"/>
          <path class="doodle" d="M92 80c9 0 11 12 1 14"/>
          <path class="doodle" d="M58 92c4 3 22 3 26 0" stroke-dasharray="2 4"/>
          <path class="doodle" d="M71 68v3M71 75v2"/>
          <path class="doodle" d="M28 118c22-3 58-3 82 0"/>
        </svg>
        <p class="empty__text">Hôm nay chưa có việc nào. Hãy thêm việc đầu tiên nhé!</p>
      </div>
      <ul class="task-list" id="task-list"></ul>
    </div>
  </main>
  </div>

  <dialog class="dialog" id="delete-dialog" role="alertdialog" aria-labelledby="del-title" aria-describedby="del-task">
    <h2 class="dialog__title" id="del-title">Bạn có chắc muốn xóa việc này không?</h2>
    <p class="dialog__quote" id="del-task"></p>
    <div class="dialog__actions">
      <button class="btn btn--secondary" type="button" data-action="keep" autofocus>Giữ lại</button>
      <button class="btn btn--danger" type="button" data-action="delete">Xóa việc</button>
    </div>
  </dialog>

  <template id="task-template">
    <li class="task">
      <label class="check"><input type="checkbox" aria-label="Đánh dấu hoàn thành"><span class="check__box" aria-hidden="true"><svg viewBox="0 0 28 28"><path pathLength="100" d="M5 15.5c2.2 1.6 3.9 3.6 5.2 6.2C13.4 13.6 18 7.4 25 2.5"/></svg></span></label>
      <div class="task__swipe">
        <span class="task__text"><span class="task__label"></span></span>
        <span class="task__actions">
          <button class="icon-btn" type="button" data-action="edit" aria-label="Sửa"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></svg><span class="icon-btn__label" aria-hidden="true">Sửa</span></button>
          <button class="icon-btn icon-btn--danger" type="button" data-action="remove" aria-label="Xóa"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg><span class="icon-btn__label" aria-hidden="true">Xóa</span></button>
        </span>
      </div>
    </li>
  </template>

  <template id="edit-template">
    <form class="task__edit" novalidate>
      <label class="visually-hidden">Sửa</label>
      <input class="input" type="text" autocomplete="off">
      <p class="field-error" role="alert" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="field-error__text"></span></p>
      <div class="task__edit-actions">
        <button class="btn btn--ghost" type="button" data-action="cancel">Hủy</button>
        <button class="btn btn--primary" type="submit">Lưu</button>
      </div>
    </form>
  </template>
</body>
</html>
